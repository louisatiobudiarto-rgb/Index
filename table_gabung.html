<!DOCTYPE html>
<html>
    <head>
        <title>Colspan dan Rowspan</title>
        <link rel="stylesheet" href="table_gabung.css">
        <link rel="stylesheet" href="INDEX2.CSS">
        <link rel="stylesheet" href="biodata.css">
        <link rel="stylesheet" href="Table2.css">
    </head>
    <body>


        <h3>Colspan dan Rowspan pada Table</h3>
        <!-- colpsan : menggabungkan kolom
         rowspan : menggabung baris-->
         <table class="table1">
            <tr>
                <th rowspan="2">No</th>
                <th rowspan="2">Nama</th>
                <th colspan="2">Nilai</th>
            </tr>
            <tr>
                <th class="ulangan1">Ulangan 1</th>
                <th class="ulangan1">Ulangan 2</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Tsukasa</td>
                <td>90</td>
                <td>95</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Rui</td>
                <td>99</td>
                <td>98</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Nene</td>
                <td>97</td>
                <td>96</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Emu</td>
                <td>93</td>
                <td>91</td>
            </tr>
            <tr>
                <td>5</td>
                <td>Toya</td>
                <td>99.9</td>
                <td>100</td>
            </tr>
         </table>
    </body>
</html>
